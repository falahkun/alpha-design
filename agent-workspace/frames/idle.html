<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=402, height=874, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Login — Idle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 402px;
      height: 874px;
      min-width: 402px;
      max-width: 402px;
      min-height: 874px;
      max-height: 874px;
      overflow: hidden;
      background-color: #FFFFFF;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #0F172A;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .screen-container {
      width: 402px;
      height: 874px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: max(62px, env(safe-area-inset-top, 62px));
      padding-bottom: max(34px, env(safe-area-inset-bottom, 34px));
      padding-left: 24px;
      padding-right: 24px;
      background-color: #FFFFFF;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .nav-bar {
      display: flex;
      align-items: center;
      height: 44px;
      margin-bottom: 20px;
    }

    .nav-back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      margin-left: -10px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #0F172A;
      border-radius: 8px;
    }

    .header-group {
      margin-bottom: 28px;
    }

    .page-title {
      font-size: 26px;
      font-weight: 700;
      color: #0F172A;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: 14px;
      font-weight: 400;
      color: #64748B;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 48px;
      background-color: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      box-sizing: border-box;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-wrapper:focus-within {
      border-color: #1E40AF;
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.12);
    }

    .leading-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: #64748B;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .text-input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      padding-left: 42px;
      padding-right: 44px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: #0F172A;
      outline: none;
    }

    .text-input::placeholder {
      color: #94A3B8;
      font-weight: 400;
    }

    .trailing-action-btn {
      position: absolute;
      right: 2px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #64748B;
      border-radius: 6px;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      margin-bottom: 24px;
      min-height: 24px;
    }

    .checkbox-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-box {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1.5px solid #94A3B8;
      background-color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      transition: all 0.15s ease;
    }

    .checkbox-label {
      font-size: 13px;
      font-weight: 500;
      color: #475569;
    }

    .forgot-password-link {
      font-size: 13px;
      font-weight: 600;
      color: #1E40AF;
      text-decoration: none;
      padding: 4px 0;
    }

    .cta-button {
      width: 100%;
      height: 48px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      box-sizing: border-box;
      transition: background-color 0.15s ease;
    }

    .cta-button.disabled {
      background-color: #E2E8F0;
      color: #94A3B8;
      cursor: not-allowed;
    }

    .divider-container {
      display: flex;
      align-items: center;
      margin: 22px 0 18px 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background-color: #E2E8F0;
    }

    .divider-label {
      padding: 0 12px;
      font-size: 11px;
      font-weight: 600;
      color: #94A3B8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .sso-button {
      width: 100%;
      height: 48px;
      border-radius: 8px;
      background-color: #FFFFFF;
      border: 1px solid #CBD5E1;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #1E293B;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-sizing: border-box;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .bottom-support-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 16px;
    }

    .support-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: #64748B;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="screen-container">
    <div class="main-content">
      <!-- Back Navigation -->
      <nav class="nav-bar">
        <button type="button" class="nav-back-btn" aria-label="Back">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
      </nav>

      <!-- Header Group -->
      <header class="header-group">
        <h1 class="page-title">Log in</h1>
        <p class="page-subtitle">Enter your work credentials to access your Aksa Digital employee account.</p>
      </header>

      <!-- Login Form -->
      <form class="login-form" onsubmit="return false;" novalidate>
        <!-- Email Field -->
        <div class="form-group">
          <label class="field-label" for="email-input">Work Email</label>
          <div class="input-wrapper">
            <span class="leading-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input
              type="email"
              id="email-input"
              class="text-input"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label class="field-label" for="password-input">Password</label>
          <div class="input-wrapper">
            <span class="leading-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="password-input"
              class="text-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="trailing-action-btn" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="meta-row">
          <label class="checkbox-control">
            <span class="checkbox-box" aria-hidden="true"></span>
            <span class="checkbox-label">Remember me</span>
          </label>
          <a href="#" class="forgot-password-link">Forgot password?</a>
        </div>

        <!-- Primary CTA Button (Disabled in Idle) -->
        <button type="submit" class="cta-button disabled" disabled>
          <span>Log in</span>
        </button>

        <!-- Alternative Method Divider -->
        <div class="divider-container" aria-hidden="true">
          <span class="divider-line"></span>
          <span class="divider-label">or continue with</span>
          <span class="divider-line"></span>
        </div>

        <!-- SSO Button -->
        <button type="button" class="sso-button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="16" height="20" x="4" y="2" rx="2" ry="2"/>
            <path d="M9 22v-4h6v4"/>
            <path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/>
            <path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/>
            <path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/>
          </svg>
          <span>Single sign-on (SSO)</span>
        </button>
      </form>
    </div>

    <!-- Restrained Support / IT Help bar respecting safe area -->
    <div class="bottom-support-bar">
      <button type="button" class="support-action-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span>Need help or reporting an issue? IT Support</span>
      </button>
    </div>
  </div>
</body>
</html>
